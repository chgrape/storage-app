apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-app
spec:
  selector:
    matchLabels:
      app: media-app
  template:
    metadata:
      labels:
        app: media-app
    spec:
      containers:
      - name: media-app
        image: media-service:latest
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
spec:
  selector:
    app: media-app
  ports:
  - port: 8081
    targetPort: 8081
