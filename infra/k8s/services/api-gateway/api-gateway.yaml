apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: chgrape69/api-gateway:latest
        env:
          - name: MEDIA_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: gateway-config
                key: media_service_addr
          - name: KEYCLOAK_ADDR
            valueFrom:
              configMapKeyRef:
                name: gateway-config
                key: keycloak_addr       
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8081
    targetPort: 8081
