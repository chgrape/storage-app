syntax = "proto3";
package media;

option go_package = "github.com/chgrape/storage-app/shared/proto";

service Media {
    rpc Upload(stream UploadRequest) returns (UploadResponse);
    //rpc BulkUpload(stream UploadRequest) returns (stream UploadResponse);
    rpc Download(DownloadRequest) returns (stream DownloadResponse);
    rpc List(ListRequest) returns (ListResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message FileMetadata{
    string filename = 1;
    string mime = 2;
    int64 size = 3;
    string user_id = 4;
}

message UploadRequest {
    oneof payload{
        FileMetadata metadata = 1;
        bytes data = 2;
    }
}

message UploadResponse {
    string id = 1;
    string error = 2;
    bool saved = 3;
}

message DownloadRequest {
    string id = 1;
    string user_id = 2;
}

message DownloadResponse {
    bytes data = 1;
    string filename = 2;
    string mime = 3;
}

message FileRecord {
    string id = 1;
    string filename = 2;
    string mime_type = 3;
    int64  size = 4;
    string uploaded_at = 5;
    string user_id = 6;
}

message ListRequest {
    string user_id = 1;
}

message ListResponse {
    repeated FileRecord files = 1;
}

message DeleteRequest {
    string id = 1;
    string user_id = 2;
}

message DeleteResponse {
    bool success = 1;
}